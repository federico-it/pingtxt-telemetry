name: docker

# Only release tags: Coolify builds the running service from the Dockerfile
# on main, and pull requests already build and start the image in ci.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$GITHUB_REF_NAME-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A v1.2.3 tag pushes :1.2.3 and :latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pingtxt-telemetry
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pingtxt-telemetry@${{ steps.build.outputs.digest }}
        # Rekor sometimes answers 409 "equivalent entry already exists" when its
        # first reply timed out; a new attempt signs with fresh keys and passes.
        run: |
          for i in 1 2 3; do
            cosign sign --yes "$IMAGE" && exit 0
            echo "cosign sign failed (attempt $i), retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          exit 1
